<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronarch Authority</title>
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud-overlay">
    <div id="crosshair"></div>
    
    <div id="top-bar">
      <div class="hud-card"><span class="label">VARIANT ID:</span> <span>VAR-9042-DELTA</span></div>
      <div class="hud-card"><span class="label">DEVIATION:</span> <span id="deviation-display">0</span></div>
      <div class="hud-card"><span class="label">ALERT:</span> <span id="alert-display">LEVEL 0 (NORMAL)</span></div>
    </div>

    <div id="interaction-prompt" class="hidden">[E] Interact</div>

    <div id="objective-tracker">
      <div class="title">CURRENT DIRECTIVE</div>
      <div id="objective-text">Locate the Archives Terminal.</div>
    </div>
  </div>

  <div id="dialogue-modal" class="hidden">
    <div id="dialogue-box">
      <div id="dialogue-speaker">NPC</div>
      <div id="dialogue-text">...</div>
      <div id="dialogue-options"></div>
    </div>
  </div>

  <div id="terminal-modal" class="hidden">
    <div class="terminal-frame">
      <div class="terminal-header">CHRONARCH AUTHORITY - TERMINAL</div>
      <div id="terminal-content"></div>
      <button id="close-terminal-btn" class="sys-btn">CLOSE</button>
    </div>
  </div>

  <div id="blocker">
    <div id="instructions">
      <h1 class="title-logo">CHRONARCH AUTHORITY</h1>
      <p>Click anywhere to start</p>
      <div class="controls-guide">
        <p><strong>WASD</strong> : Move | <strong>SHIFT</strong> : Run | <strong>CTRL / C</strong> : Crouch</p>
        <p><strong>E</strong> : Interact | <strong>F</strong> : Use Temporal Rod</p>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
